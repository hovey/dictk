name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call: # allows release.yml to invoke this workflow's jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, format check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build check
        run: uv build

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run ruff lint check
        run: uv run ruff check

      - name: Run pytest with coverage
        run: uv run pytest --cov=src/dictk --cov-report=xml --cov-report=html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: report-coverage
          path: |
            htmlcov/
            coverage.xml

  docs:
    name: Build and deploy docs (mdBook + pdoc)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    # Serializes main's and dev's deploys into a single queue (rather than
    # cancelling either) so two pushes close together can never race to
    # clone/modify/push the gh-pages branch at the same time — see the
    # "Deploy to gh-pages branch" step below.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set deploy subdirectory
        # docs job only runs for main or dev (see `if:` above), so ref_name
        # is always exactly one of those two branch names.
        run: echo "DEPLOY_SUBDIR=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Download coverage report from test job
        uses: actions/download-artifact@v8
        with:
          name: report-coverage
          path: coverage-report

      - name: Generate coverage badge
        run: uv run genbadge coverage -i coverage-report/coverage.xml -o coverage-badge.svg

      - name: Run pylint (informational) and generate lint badge/report
        # pylint is not a CI gate — ruff (format + lint) already gated this
        # job via needs: test. pylint runs here purely to produce a 0-10
        # score (a metric ruff has no equivalent of) for the README badge,
        # plus a full findings report. `|| true`: a nonzero pylint exit code
        # (e.g. any convention/refactor finding) must not fail this job.
        run: |
          LINT_OUTPUT=$(uv run pylint src/dictk --output-format=text --reports=yes || true)
          echo "$LINT_OUTPUT" > pylint-report.txt
          SCORE=$(echo "$LINT_OUTPUT" | grep "Your code has been rated at" | awk '{print $7}' | cut -d'/' -f1)
          echo "pylint score: ${SCORE}/10"

          COLOR=$(awk -v s="$SCORE" 'BEGIN {
            if (s >= 9) print "brightgreen";
            else if (s >= 7) print "green";
            else if (s >= 5) print "yellowgreen";
            else if (s >= 3) print "yellow";
            else if (s >= 1) print "orange";
            else print "red";
          }')
          curl -s -o lint-badge.svg "https://img.shields.io/badge/pylint-${SCORE}%2F10-${COLOR}.svg?style=flat"

          uv run python .github/scripts/render_pylint_report.py \
            --input pylint-report.txt --output pylint-report.html

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned to 0.4.52: mdbook-cmdrun (below) depends on the mdbook
          # crate's 0.4.x preprocessor JSON schema, which changed in mdbook
          # 0.5. See https://github.com/FauconFan/mdbook-cmdrun/issues/22.
          # mdbook-katex (below) has the same constraint -- its own 0.10.x
          # line moved to the newer mdbook-preprocessor 0.5.x schema, so
          # it's pinned to 0.9.4 (mdbook ^0.4.48) to match.
          mdbook-version: "0.4.52"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-mdbook-preprocessors-${{ runner.os }}

      - name: Install mdbook-cmdrun
        # cargo install always recompiles from source, even when the exact
        # binary is already sitting in the cache restored above — the old
        # `--force` flag masked a "binary already exists" error but still
        # paid the ~80s compile cost on every run, silently defeating the
        # cache's whole purpose. Skip entirely when the cache already
        # restored a working binary to ~/.cargo/bin.
        run: command -v mdbook-cmdrun || cargo install mdbook-cmdrun --locked

      - name: Install mdbook-katex
        # Pinned to 0.9.4, not latest -- see the mdBook install step above
        # for why. Same skip-if-cached approach as mdbook-cmdrun.
        run: command -v mdbook-katex || cargo install mdbook-katex --version 0.9.4 --locked

      - name: Build user guide
        # mdbook-cmdrun resolves each cmdrun command's working directory
        # relative to the process cwd, so this must run from inside
        # docs/userguide (matching `book.src = "src"` in book.toml), not as
        # `mdbook build docs/userguide` from the repo root.
        run: cd docs/userguide && uv run --project ../.. mdbook build

      - name: Build API docs
        # dictk.image/translation/cli must be listed explicitly: pdoc's
        # automatic submodule discovery respects a package's __all__, and
        # only rosta is exported there — see
        # CONTRIBUTING.md#building-the-api-docs. Forgetting a new submodule
        # here doesn't fail the build, it just silently omits it from the
        # published docs (as dictk.image and dictk.translation were until
        # this comment), so double-check this list against src/dictk/*.py
        # when adding a new top-level module.
        run: uv run pdoc dictk dictk.image dictk.translation dictk.correlation dictk.cli -o docs/api

      - name: Generate status dashboard
        run: |
          uv run python .github/scripts/render_dashboard.py \
            --github-repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --ref-name "${{ github.ref_name }}" \
            --timestamp "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --output dashboard.html

      - name: Assemble combined site
        # mdBook, pdoc, the coverage report, and the pylint report each produce
        # standalone output; they're staged under one directory (API docs at
        # api/, badges at badges/, coverage report at coverage/, lint report
        # at reports/lint/, dashboard at dashboard/) which becomes this
        # branch's whole subtree on gh-pages (main/ or dev/ — see "Deploy to
        # gh-pages branch" below), so a single deploy step can replace it
        # atomically without touching the other branch's subtree.
        run: |
          mkdir -p site
          cp -r docs/userguide/book/. site/
          mkdir -p site/api
          cp -r docs/api/. site/api/
          mkdir -p site/badges
          cp coverage-badge.svg site/badges/coverage.svg
          cp lint-badge.svg site/badges/lint.svg
          mkdir -p site/coverage
          cp -r coverage-report/htmlcov/. site/coverage/
          mkdir -p site/reports/lint
          cp pylint-report.html site/reports/lint/index.html
          mkdir -p site/dashboard
          cp dashboard.html site/dashboard/index.html

      - name: Generate landing page
        # Root index.html on gh-pages, linking to main/ and dev/. Regenerated
        # on every deploy, so it always reflects whichever branch (main or
        # dev) most recently deployed — see render_landing.py.
        run: |
          uv run python .github/scripts/render_landing.py \
            --github-repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --ref-name "${{ github.ref_name }}" \
            --timestamp "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --output landing.html

      - name: Deploy to gh-pages branch
        # Not peaceiris/actions-gh-pages: it replaces the whole publish_dir
        # (or, with keep_files, tries to preserve everything else, which is
        # imprecise if main and dev deploy close together and risks one
        # branch's content clobbering the other's — see
        # sandialabs/rattlesnake-vibration-controller's ci.yml, which hit
        # this and switched to the same clone/replace-subdir/push approach
        # used here). This only ever touches ${DEPLOY_SUBDIR}/ and the root
        # index.html, leaving the other branch's subtree untouched; the
        # concurrency group above ensures main's and dev's deploys never run
        # this step at the same time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages-deploy

          rm -rf "gh-pages-deploy/${DEPLOY_SUBDIR}"
          mkdir -p "gh-pages-deploy/${DEPLOY_SUBDIR}"
          cp -r site/. "gh-pages-deploy/${DEPLOY_SUBDIR}/"
          cp landing.html gh-pages-deploy/index.html

          cd gh-pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Deploy ${DEPLOY_SUBDIR} from ${{ github.sha }}"
          git push origin gh-pages
