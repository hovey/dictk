[book]
title = "dictk User Guide"
description = "Digital Image Correlation Toolkit"
authors = ["Chad Hovey"]
src = "docs/userguide/src"
language = "en"

[output.html]
git-repository-url = "https://github.com/hovey/dictk"
additional-css = ["docs/userguide/theme/custom.css"]

# KaTeX renders $$...$$ math blocks; faster than MathJax, no local LaTeX
# install needed. Same [preprocessor.katex] config hdic's userguide uses.
[preprocessor.katex]
after = ["links"]

[preprocessor.cmdrun]

# Numbers every <figure> as "Figure <section>-<n>". Runs after cmdrun so
# any figure a cmdrun script prints gets numbered too.
[preprocessor.figure-number]
command = "python3 docs/userguide/figure_number.py"
after = ["cmdrun"]

[build]
build-dir = "docs/userguide/book"
